name: Build Peninsular Malaysia restaurant catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: '27 2 * * 1'
  push:
    paths:
      - 'scripts/build-peninsula.py'
      - '.github/workflows/build-peninsula.yml'

permissions:
  contents: write

concurrency:
  group: peninsular-osm-build
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenStreetMap and GIS parsers
        run: python -m pip install --disable-pip-version-check osmium shapely requests
      - name: Create named real food POIs and mall/city index for Peninsular Malaysia
        run: python scripts/build-peninsula.py
      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/peninsula
          if ! git diff --staged --quiet; then
            git commit -m "data: refresh Peninsular Malaysia food POIs from OSM"
            # UI edits can land while the large nationwide dataset is building.
            # Rebase data-only commit on the latest main instead of overwriting it.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Remote main changed; retrying safe data-only rebase"
              sleep 3
            done
            echo "Could not safely publish national data after retries"
            exit 1
          fi
