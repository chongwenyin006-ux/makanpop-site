name: Build Peninsular Malaysia restaurant catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: '27 2 * * 1'
  push:
    paths:
      - 'scripts/build-peninsula.py'
      - '.github/workflows/build-peninsula.yml'

permissions:
  contents: write

concurrency:
  group: peninsular-osm-build
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenStreetMap and GIS parsers
        run: python -m pip install --disable-pip-version-check osmium shapely requests
      - name: Create named real food POIs and mall/city index for Peninsular Malaysia
        run: python scripts/build-peninsula.py
      - name: Safely publish only generated map data
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Hold the generated dataset outside the checkout while resolving
          # concurrent updates. Never overwrite newer website code.
          mkdir -p "$RUNNER_TEMP/makanpop-dataset"
          cp -a public/data/peninsula "$RUNNER_TEMP/makanpop-dataset/peninsula"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf public/data/peninsula
            cp -a "$RUNNER_TEMP/makanpop-dataset/peninsula" public/data/peninsula
            git add -A public/data/peninsula
            if git diff --staged --quiet; then
              echo "Latest dataset is already published."
              exit 0
            fi
            git commit -m "data: refresh Peninsular Malaysia food POIs from OSM"
            if git push origin HEAD:main; then
              echo "Successfully published latest OSM dataset."
              exit 0
            fi
            echo "Another update arrived; retrying without rebasing 3000+ generated files"
            sleep 3
          done
          echo "Unable to publish latest OSM dataset without conflicts."
          exit 1
