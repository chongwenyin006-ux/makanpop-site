name: Build Peninsular Malaysia restaurant catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: '27 2 2 * *'
  push:
    paths:
      - 'scripts/build-peninsula.py'
      - '.github/workflows/build-peninsula.yml'

permissions:
  contents: write

concurrency:
  group: peninsular-osm-build
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenStreetMap and GIS parsers
        run: python -m pip install --disable-pip-version-check osmium shapely requests
      - name: Create named real food POIs and mall/city index for Peninsular Malaysia
        run: python scripts/build-peninsula.py
      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/peninsula
          if ! git diff --staged --quiet; then
            git commit -m "data: refresh Peninsular Malaysia food POIs from OSM"
            git push
          fi
