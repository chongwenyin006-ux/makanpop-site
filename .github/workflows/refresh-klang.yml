name: Refresh real Klang restaurants

# Klang is now part of the nationwide Geofabrik dataset. This optional
# Overpass snapshot is only a manual fallback, not a scheduled dependency.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: klang-osm-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Get a small OpenStreetMap snapshot
        run: node scripts/refresh-klang.mjs
      - name: Commit snapshot only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/klang-restaurants.json
          if ! git diff --staged --quiet; then
            git commit -m "data: refresh real Klang restaurants from OpenStreetMap"
            git push
          fi
